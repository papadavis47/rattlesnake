# TYPE HINTS

[[exercises]]
name = "type_hints1"
dir = "01_type_hints"
hint = """
Python type hints use the colon syntax for parameters and `->` for return types:

    def greet(name: str, age: int) -> str:

This doesn't change how the function runs — it's metadata for tools and readers."""

[[exercises]]
name = "type_hints2"
dir = "01_type_hints"
hint = """
In modern Python (3.10+), you can use `X | None` instead of `Optional[X]`:

    def find_user(user_id: int) -> dict | None:

For the `last` parameter, use `str | None = None` to indicate it's optional."""

# DATA STRUCTURES

[[exercises]]
name = "data_structures1"
dir = "02_data_structures"
hint = """
Dataclasses generate `__init__`, `__repr__`, `__eq__` and more automatically:

    from dataclasses import dataclass

    @dataclass(frozen=True)
    class Point:
        x: float
        y: float
        z: float = 0.0

The `frozen=True` makes instances immutable (no attribute reassignment)."""

# COMPREHENSIONS

[[exercises]]
name = "comprehensions1"
dir = "03_comprehensions"
lint = false
hint = """
List comprehension:  [expr for item in iterable if condition]
Dict comprehension:  {key: value for item in iterable}
Set comprehension:   {expr for item in iterable}

For example: `[x**2 for x in numbers if x % 2 == 0]`"""

# DECORATORS

[[exercises]]
name = "decorators1"
dir = "04_decorators"
hint = """
A decorator is a function that takes a function and returns a new function:

    def timer(func):
        @wraps(func)
        def wrapper(*args, **kwargs):
            start = time.perf_counter()
            result = func(*args, **kwargs)
            elapsed = time.perf_counter() - start
            print(f"{func.__name__} took {elapsed:.4f} seconds")
            return result
        return wrapper

Use `@wraps(func)` from functools to preserve the original function's
name and docstring."""

# CONTEXT MANAGERS

[[exercises]]
name = "context_managers1"
dir = "05_context_managers"
hint = """
A context manager class needs two methods:

    def __enter__(self):
        # Set up and return the resource
        return resource

    def __exit__(self, exc_type, exc_val, exc_tb):
        # Clean up the resource
        return False  # Don't suppress exceptions

Use `tempfile.mkdtemp()` to create the directory and `shutil.rmtree()` to remove it."""

[[exercises]]
name = "context_managers2"
dir = "05_context_managers"
hint = """
The `@contextmanager` decorator from `contextlib` lets you write a context
manager as a generator function:

    @contextmanager
    def my_cm():
        # setup
        try:
            yield resource
        finally:
            # teardown

Everything before `yield` is `__enter__`, and the `finally` block is `__exit__`.
Save the original `sys.stdout`, replace it, yield, then restore it."""

# OOP

[[exercises]]
name = "oop1"
dir = "06_oop"
hint = """
To make an abstract base class:

    from abc import ABC, abstractmethod

    class Shape(ABC):
        @abstractmethod
        def area(self) -> float: ...

Subclasses *must* implement all abstract methods or they can't be instantiated.
For Circle: area = math.pi * radius ** 2
For Rectangle: area = width * height"""

[[exercises]]
name = "oop2"
dir = "06_oop"
lint = false
hint = """
In cooperative multiple inheritance, every `__init__` must call `super().__init__()` 
and pass along `**kwargs` so the MRO chain isn't broken:

    class Mixin(Base):
        def __init__(self, **kwargs):
            super().__init__(**kwargs)
            self.my_attr = True

The key insight: `super()` doesn't call the parent — it calls the *next class
in the MRO*. Pass named arguments as keyword arguments through `**kwargs`."""

# ITERATORS AND GENERATORS

[[exercises]]
name = "iterators1"
dir = "07_iterators_generators"
hint = """
An iterator must implement two methods:

    def __iter__(self):
        return self

    def __next__(self):
        if done:
            raise StopIteration
        # return next value

You'll need a `self.current` attribute to track the countdown position.
Initialize it in `__init__` and decrement it in `__next__`."""

[[exercises]]
name = "iterators2"
dir = "07_iterators_generators"
hint = """
Generators use `yield` to produce values lazily:

    def count_up(n):
        for i in range(n):
            yield i

For Fibonacci, keep two variables `a, b = 0, 1` and swap: `a, b = b, a + b`.

`yield from` delegates to another generator:

    def flatten(items):
        for item in items:
            if isinstance(item, list):
                yield from flatten(item)
            else:
                yield item"""

# DESCRIPTORS AND PROPERTIES

[[exercises]]
name = "properties1"
dir = "08_descriptors_properties"
hint = """
Properties use decorators to make methods look like attributes:

    @property
    def celsius(self) -> float:
        return self._celsius

    @celsius.setter
    def celsius(self, value: float):
        if value < -273.15:
            raise ValueError(...)
        self._celsius = value

A read-only property just omits the setter. Use `self.celsius = celsius`
in `__init__` (not `self._celsius`) to trigger the validation."""

# ERROR HANDLING

[[exercises]]
name = "error_handling1"
dir = "09_error_handling"
hint = """
Custom exceptions inherit from Exception (or a custom base):

    class ValidationError(Exception):
        def __init__(self, message: str, field: str):
            super().__init__(message)
            self.field = field

    class MissingFieldError(ValidationError):
        def __init__(self, field: str):
            super().__init__(f"Missing: {field}", field)

Use `data.get("name")` to check for missing or empty fields."""

# CONCURRENCY

[[exercises]]
name = "concurrency1"
dir = "10_concurrency"
test = true
lint = false
hint = """
`ThreadPoolExecutor` provides a high-level interface for running tasks
in threads:

    from concurrent.futures import ThreadPoolExecutor

    with ThreadPoolExecutor() as executor:
        results = list(executor.map(func, iterable))

`executor.map()` preserves input order and blocks until all results are ready."""

# ASYNC

[[exercises]]
name = "async1"
dir = "11_async"
lint = false
hint = """
Async functions use `async def` and `await`:

    async def fetch(url):
        await asyncio.sleep(1)
        return data

To run multiple coroutines concurrently, use `asyncio.gather`:

    results = await asyncio.gather(coro1(), coro2(), coro3())

`asyncio.gather` returns results in the same order as the input coroutines."""

# TESTING

[[exercises]]
name = "testing1"
dir = "12_testing"
hint = """
Pytest fixtures provide test setup:

    @pytest.fixture
    def calc():
        return Calculator()

    def test_add(calc):       # fixture injected by name
        assert calc.add(1, 2) == 3

Use `@pytest.mark.parametrize` to test multiple inputs:

    @pytest.mark.parametrize("a,b,expected", [(1,1,2), (0,0,0)])
    def test_add(calc, a, b, expected):
        assert calc.add(a, b) == expected

Use `pytest.approx()` for floating-point comparisons."""

# FUNCTOOLS AND CLOSURES

[[exercises]]
name = "functools1"
dir = "13_functools_closures"
hint = """
A closure captures variables from its enclosing scope:

    def make_multiplier(factor):
        def multiplier(x):
            return x * factor
        return multiplier

`functools.partial` freezes some arguments:

    int_from_binary = partial(int, base=2)

`@lru_cache` memoizes function results:

    @lru_cache
    def fib(n):
        if n < 2: return n
        return fib(n-1) + fib(n-2)"""

# PATTERN MATCHING

[[exercises]]
name = "pattern_matching1"
dir = "14_pattern_matching"
hint = """
Structural pattern matching (Python 3.10+):

    match command:
        case ("quit",):
            ...
        case ("move", x, y):
            print(f"Moving to {x}, {y}")
        case _:
            print("Unknown")

For dict matching:

    match shape:
        case {"type": "circle", "radius": r}:
            return math.pi * r ** 2
        case _:
            raise ValueError(...)"""

# METACLASSES

[[exercises]]
name = "metaclasses1"
dir = "15_metaclasses"
hint = """
`__init_subclass__` is called whenever a class is subclassed:

    class Base:
        def __init_subclass__(cls, **kwargs):
            super().__init_subclass__(**kwargs)
            # cls is the new subclass
            Base._registry[cls.__name__] = cls

This is much simpler than writing a custom metaclass and covers
most registration/validation use cases."""

# PROTOCOLS AND ABCs

[[exercises]]
name = "protocols1"
dir = "16_protocols_abcs"
hint = """
`typing.Protocol` defines structural interfaces (duck typing with types):

    from typing import Protocol, runtime_checkable

    @runtime_checkable
    class Drawable(Protocol):
        def draw(self) -> str: ...

Any class with a `draw() -> str` method satisfies `Drawable` — no
inheritance needed! Use `@runtime_checkable` to enable `isinstance()` checks."""
