# TYPE HINTS

[[exercises]]
name = "type_hints1"
dir = "01_type_hints"
hint = """
Python type hints use the colon syntax for parameters and `->` for return types:

    def greet(name: str, age: int) -> str:

This doesn't change how the function runs — it's metadata for tools and readers."""

[[exercises]]
name = "type_hints2"
dir = "01_type_hints"
hint = """
In modern Python (3.10+), you can use `X | None` instead of `Optional[X]`:

    def find_user(user_id: int) -> dict | None:

For the `last` parameter, use `str | None = None` to indicate it's optional."""

[[exercises]]
name = "type_hints3"
dir = "01_type_hints"
type_check = true
hint = """
Annotate a callable with its parameter and return types:

    operation: Callable[[int], int]

Define `T = TypeVar("T")`, then use `list[T] -> T` so `first` preserves the
element type for lists of strings, integers, or any other type."""

# DATA STRUCTURES

[[exercises]]
name = "data_structures1"
dir = "02_data_structures"
hint = """
Dataclasses generate `__init__`, `__repr__`, `__eq__` and more automatically:

    from dataclasses import dataclass

    @dataclass(frozen=True)
    class Point:
        x: float
        y: float
        z: float = 0.0

The `frozen=True` makes instances immutable (no attribute reassignment)."""

[[exercises]]
name = "data_structures2"
dir = "02_data_structures"
hint = """
Use `auto()` for each enum member so Python generates unique values:

    class State(Enum):
        READY = auto()

An enum property can compare the current member by identity, such as
`self is TrafficLight.GREEN`."""

# COMPREHENSIONS

[[exercises]]
name = "comprehensions1"
dir = "03_comprehensions"
lint = false
hint = """
List comprehension:  [expr for item in iterable if condition]
Dict comprehension:  {key: value for item in iterable}
Set comprehension:   {expr for item in iterable}

For example: `[x**2 for x in numbers if x % 2 == 0]`"""

[[exercises]]
name = "comprehensions2"
dir = "03_comprehensions"
hint = """
Nested comprehensions list their loops in the same order as nested `for` loops:

    [value for row in rows for value in row if condition]

Use `value > 0` as the final filter while preserving row and item order."""

# DECORATORS

[[exercises]]
name = "decorators1"
dir = "04_decorators"
hint = """
A decorator is a function that takes a function and returns a new function:

    def timer(func):
        @wraps(func)
        def wrapper(*args, **kwargs):
            start = time.perf_counter()
            result = func(*args, **kwargs)
            elapsed = time.perf_counter() - start
            print(f"{func.__name__} took {elapsed:.4f} seconds")
            return result
        return wrapper

Use `@wraps(func)` from functools to preserve the original function's
name and docstring."""

[[exercises]]
name = "decorators2"
dir = "04_decorators"
hint = """
A parameterized decorator has three layers: `repeat(times)`, a decorator that
accepts the function, and a wrapper that accepts `*args, **kwargs`.

Call the function inside `for _ in range(times)`, retain the last result, and
decorate the wrapper with `@wraps(function)` before returning it."""

# CONTEXT MANAGERS

[[exercises]]
name = "context_managers1"
dir = "05_context_managers"
hint = """
A context manager class needs two methods:

    def __enter__(self):
        # Set up and return the resource
        return resource

    def __exit__(self, exc_type, exc_val, exc_tb):
        # Clean up the resource
        return False  # Don't suppress exceptions

Use `tempfile.mkdtemp()` to create the directory and `shutil.rmtree()` to remove it."""

[[exercises]]
name = "context_managers2"
dir = "05_context_managers"
hint = """
The `@contextmanager` decorator from `contextlib` lets you write a context
manager as a generator function:

    @contextmanager
    def my_cm():
        # setup
        try:
            yield resource
        finally:
            # teardown

Everything before `yield` is `__enter__`, and the `finally` block is `__exit__`.
Save the original `sys.stdout`, replace it, yield, then restore it."""

[[exercises]]
name = "context_managers3"
dir = "05_context_managers"
hint = """
`ExitStack` collects context managers dynamically and closes them in reverse
order when its `with` block ends:

    with ExitStack() as stack:
        values = [stack.enter_context(resource) for resource in resources]

Return the collected values from inside the block; cleanup still runs."""

# OOP

[[exercises]]
name = "oop1"
dir = "06_oop"
hint = """
To make an abstract base class:

    from abc import ABC, abstractmethod

    class Shape(ABC):
        @abstractmethod
        def area(self) -> float: ...

Subclasses *must* implement all abstract methods or they can't be instantiated.
For Circle: area = math.pi * radius ** 2
For Rectangle: area = width * height"""

[[exercises]]
name = "oop2"
dir = "06_oop"
lint = false
hint = """
In cooperative multiple inheritance, every `__init__` must call `super().__init__()` 
and pass along `**kwargs` so the MRO chain isn't broken:

    class Mixin(Base):
        def __init__(self, **kwargs):
            super().__init__(**kwargs)
            self.my_attr = True

The key insight: `super()` doesn't call the parent — it calls the *next class
in the MRO*. Pass named arguments as keyword arguments through `**kwargs`."""

[[exercises]]
name = "oop3"
dir = "06_oop"
hint = """
Composition stores another object rather than inheriting from its class.

Assign `self.engine = engine` in `Car.__init__`, then delegate work by calling
`self.engine.start()` when building the car's start message."""

# ITERATORS AND GENERATORS

[[exercises]]
name = "iterators1"
dir = "07_iterators_generators"
hint = """
An iterator must implement two methods:

    def __iter__(self):
        return self

    def __next__(self):
        if done:
            raise StopIteration
        # return next value

You'll need a `self.current` attribute to track the countdown position.
Initialize it in `__init__` and decrement it in `__next__`."""

[[exercises]]
name = "iterators2"
dir = "07_iterators_generators"
hint = """
Generators use `yield` to produce values lazily:

    def count_up(n):
        for i in range(n):
            yield i

For Fibonacci, keep two variables `a, b = 0, 1` and swap: `a, b = b, a + b`.

`yield from` delegates to another generator:

    def flatten(items):
        for item in items:
            if isinstance(item, list):
                yield from flatten(item)
            else:
                yield item"""

[[exercises]]
name = "iterators3"
dir = "07_iterators_generators"
hint = """
`chain(intro, cycle(loop))` produces the intro once and then repeats the loop.
Because `cycle` is infinite, wrap that iterator with `islice(..., total)` and
convert the finite slice to a list."""

# DESCRIPTORS AND PROPERTIES

[[exercises]]
name = "properties1"
dir = "08_descriptors_properties"
hint = """
Properties use decorators to make methods look like attributes:

    @property
    def celsius(self) -> float:
        return self._celsius

    @celsius.setter
    def celsius(self, value: float):
        if value < -273.15:
            raise ValueError(...)
        self._celsius = value

A read-only property just omits the setter. Use `self.celsius = celsius`
in `__init__` (not `self._celsius`) to trigger the validation."""

[[exercises]]
name = "descriptors1"
dir = "08_descriptors_properties"
hint = """
`__set_name__` receives the managed attribute name; save a private name such as
`f"_{name}"`. In `__get__`, return the descriptor when `instance is None`, or
read the private attribute. In `__set__`, validate first and then use `setattr`
to store the value under that private name."""

# ERROR HANDLING

[[exercises]]
name = "error_handling1"
dir = "09_error_handling"
hint = """
Custom exceptions inherit from Exception (or a custom base):

    class ValidationError(Exception):
        def __init__(self, message: str, field: str):
            super().__init__(message)
            self.field = field

    class MissingFieldError(ValidationError):
        def __init__(self, field: str):
            super().__init__(f"Missing: {field}", field)

Use `data.get("name")` to check for missing or empty fields."""

[[exercises]]
name = "error_handling2"
dir = "09_error_handling"
hint = """
An `ExceptionGroup` can contain unrelated exception types. Use separate clauses:

    except* ValueError as group:
        ...
    except* TypeError as group:
        ...

Each clause receives only its matching subgroup in `group.exceptions`."""

