        ...

Add another registration for `list`. Other types use the default function."""

# PATTERN MATCHING

[[exercises]]
name = "pattern_matching1"
dir = "14_pattern_matching"
hint = """
Structural pattern matching (Python 3.10+):

    match command:
        case ("quit",):
            ...
        case ("move", x, y):
            print(f"Moving to {x}, {y}")
        case _:
            print("Unknown")

For dict matching:

    match shape:
        case {"type": "circle", "radius": r}:
            return math.pi * r ** 2
        case _:
            raise ValueError(...)"""

[[exercises]]
name = "pattern_matching2"
dir = "14_pattern_matching"
hint = """
Dataclasses support positional class patterns through their generated
`__match_args__`:

    case Point(0, 0):
        return "origin"
    case Point(x, y):
        ...

Match the special origin case before the general point case."""

# METACLASSES

[[exercises]]
name = "metaclasses1"
dir = "15_metaclasses"
hint = """
`__init_subclass__` is called whenever a class is subclassed:

    class Base:
        def __init_subclass__(cls, **kwargs):
            super().__init_subclass__(**kwargs)
            # cls is the new subclass
            Base._registry[cls.__name__] = cls

This is much simpler than writing a custom metaclass and covers
most registration/validation use cases."""

[[exercises]]
name = "metaclasses2"
dir = "15_metaclasses"
hint = """
Inside metaclass `__new__`, inspect `namespace.get("__annotations__", {})`.
Build a tuple of names that do not start with `_`, assign it to
`namespace["fields"]`, then call `super().__new__(mcls, name, bases, namespace)`
to create the class."""

# PROTOCOLS AND ABCs

[[exercises]]
name = "protocols1"
dir = "16_protocols_abcs"
hint = """
`typing.Protocol` defines structural interfaces (duck typing with types):

    from typing import Protocol, runtime_checkable

    @runtime_checkable
    class Drawable(Protocol):
        def draw(self) -> str: ...

Any class with a `draw() -> str` method satisfies `Drawable` — no
inheritance needed! Use `@runtime_checkable` to enable `isinstance()` checks."""

[[exercises]]
name = "protocols2"
dir = "16_protocols_abcs"
type_check = true
hint = """
Use a covariant type variable for the read-only protocol:

    T_co = TypeVar("T_co", covariant=True)
    class Readable(Protocol[T_co]):
        def read(self) -> T_co: ...

A consumer preserves the concrete result type with:

    def read_first(source: Readable[T]) -> T:
        return source.read()

`Box(Generic[T])` satisfies the protocol structurally without inheriting from
it."""

